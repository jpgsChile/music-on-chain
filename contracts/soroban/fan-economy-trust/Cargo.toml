[package]
name = "fan-economy-trust"
version = "0.1.0"
edition = "2021"
description = "Soroban trust execution for Music On Chain Fan Economy. Accounting commitment, not asset custody."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils", "dep:serde_json"]

[[bin]]
name = "fan-economy-trust-harness"
path = "src/bin/harness.rs"
required-features = ["testutils"]

[dependencies.serde_json]
version = "1"
optional = true
